<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgH" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2D3A29"/>
      <stop offset="60%" stop-color="#1B2418"/>
      <stop offset="100%" stop-color="#10170F"/>
    </radialGradient>
    <radialGradient id="amberGlowH" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#FFB326" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#E5A33C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC843"/>
      <stop offset="50%" stop-color="#E5921A"/>
      <stop offset="100%" stop-color="#9C5508"/>
    </linearGradient>
    <linearGradient id="jarLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D49942"/>
      <stop offset="50%" stop-color="#FCE19C"/>
      <stop offset="100%" stop-color="#AA6E1B"/>
    </linearGradient>
    <filter id="shadowH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgH)"/>
  <circle cx="250" cy="240" r="185" fill="url(#amberGlowH)"/>

  <!-- Honeycomb background geometry -->
  <g stroke="#E5A33C" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <polygon points="170,140 190,128 210,140 210,162 190,174 170,162"/>
    <polygon points="210,162 230,150 250,162 250,184 230,196 210,184"/>
    <polygon points="290,140 310,128 330,140 330,162 310,174 290,162"/>
    <polygon points="250,162 270,150 290,162 290,184 270,196 250,184"/>
    <polygon points="130,162 150,150 170,162 170,184 150,196 130,184"/>
    <polygon points="330,162 350,150 370,162 370,184 350,196 330,184"/>
  </g>

  <!-- Honey Jar -->
  <g filter="url(#shadowH)">
    <!-- Jar glass back -->
    <path d="M190 200 C 180 200, 175 230, 175 270 C 175 325, 195 345, 250 345 C 305 345, 325 325, 325 270 C 325 230, 320 200, 310 200 Z" fill="#3D2914" stroke="#FFC843" stroke-width="2"/>
    <!-- Honey liquid fill -->
    <path d="M182 225 C 180 240, 180 270, 180 275 C 180 320, 198 338, 250 338 C 302 338, 320 320, 320 275 C 320 270, 320 240, 318 225 Z" fill="url(#honeyGrad)"/>
    
    <!-- Honey reflections & honey glow -->
    <ellipse cx="250" cy="235" rx="64" ry="12" fill="#FFE28A" opacity="0.5"/>
    <path d="M190 240 C 188 270, 192 310, 205 325" stroke="#FFF" stroke-width="3" opacity="0.4" fill="none" stroke-linecap="round"/>
    
    <!-- Craft Paper / Cloth Jar Lid -->
    <path d="M180 185 Q 250 175 320 185 L328 205 C 315 212, 305 204, 295 210 C 285 204, 275 212, 265 206 C 255 212, 245 206, 235 212 C 225 206, 215 212, 205 206 C 195 212, 185 205, 172 205 Z" fill="#E8D8BA" stroke="#9E7847" stroke-width="1.5"/>
    <!-- Twine string around neck -->
    <line x1="184" y1="200" x2="316" y2="200" stroke="#7A5229" stroke-width="3"/>
    <line x1="183" y1="203" x2="317" y2="203" stroke="#A8753B" stroke-width="2"/>
    <!-- Bow -->
    <ellipse cx="250" cy="202" rx="8" ry="4" fill="#7A5229"/>
    
    <!-- Vintage Label -->
    <rect x="210" y="245" width="80" height="65" rx="6" fill="#FFFDF8" stroke="#AA6E1B" stroke-width="1.2"/>
    <rect x="214" y="249" width="72" height="57" rx="3" fill="none" stroke="#E5921A" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="250" y="266" font-family="'Unbounded', sans-serif" font-size="7.5" font-weight="700" fill="#7A4B00" text-anchor="middle">СЫРОЙ МЁД</text>
    <line x1="225" y1="272" x2="275" y2="272" stroke="#E5921A" stroke-width="1"/>
    <text x="250" y="284" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#4B320E" text-anchor="middle">РАЗНОТРАВЬЕ</text>
    <text x="250" y="296" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="bold" fill="#AA6E1B" text-anchor="middle">БЕЗ НАГРЕВА</text>
  </g>
</svg>