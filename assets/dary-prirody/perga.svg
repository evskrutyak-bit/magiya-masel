<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgP" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2D3A29"/>
      <stop offset="60%" stop-color="#1B2418"/>
      <stop offset="100%" stop-color="#10170F"/>
    </radialGradient>
    <radialGradient id="amberGlowP" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#E5A33C" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#E5A33C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE19C"/>
      <stop offset="50%" stop-color="#C28236"/>
      <stop offset="100%" stop-color="#6E4413"/>
    </linearGradient>
    <filter id="shadowP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgP)"/>
  <circle cx="250" cy="240" r="185" fill="url(#amberGlowP)"/>

  <!-- Wild Herbs & Stems -->
  <g stroke="#7A9A6E" stroke-width="2" fill="none" opacity="0.5">
    <path d="M150 350 C 160 280, 190 230, 220 200"/>
    <path d="M350 350 C 340 280, 310 230, 280 200"/>
    <!-- Little leaves -->
    <path d="M175 290 Q 155 285 160 270 Q 175 280 175 290" fill="#4B6342"/>
    <path d="M195 255 Q 180 245 188 232 Q 200 245 195 255" fill="#4B6342"/>
    <path d="M325 290 Q 345 285 340 270 Q 325 280 325 290" fill="#4B6342"/>
    <path d="M305 255 Q 320 245 312 232 Q 300 245 305 255" fill="#4B6342"/>
  </g>

  <!-- Craft Pouch / Glass Jar of Perga -->
  <g filter="url(#shadowP)">
    <rect x="195" y="195" width="110" height="145" rx="16" fill="#1E231B" stroke="url(#goldP)" stroke-width="2"/>
    <!-- Glass sheen -->
    <rect x="202" y="202" width="96" height="131" rx="12" fill="#293025" opacity="0.8"/>
    
    <!-- Granules / Hexagons of Perga inside -->
    <g fill="#D48624" opacity="0.9">
      <polygon points="220,230 226,226 232,230 232,238 226,242 220,238"/>
      <polygon points="236,225 242,221 248,225 248,233 242,237 236,233" fill="#E5A33C"/>
      <polygon points="252,230 258,226 264,230 264,238 258,242 252,238" fill="#B36916"/>
      <polygon points="268,225 274,221 280,225 280,233 274,237 268,233"/>
      
      <polygon points="228,245 234,241 240,245 240,253 234,257 228,253" fill="#E5A33C"/>
      <polygon points="244,242 250,238 256,242 256,250 250,254 244,250"/>
      <polygon points="260,245 266,241 272,245 272,253 266,257 260,253" fill="#9C5508"/>
    </g>

    <!-- Cork Stopper -->
    <rect x="215" y="170" width="70" height="26" rx="4" fill="#C29255" stroke="#8C5F2B" stroke-width="1.5"/>
    <ellipse cx="250" cy="170" rx="35" ry="6" fill="#DFB075"/>
    
    <!-- Label -->
    <rect x="212" y="260" width="76" height="65" rx="5" fill="#FAF6EE" stroke="#C28236" stroke-width="1"/>
    <text x="250" y="278" font-family="'Unbounded', sans-serif" font-size="7" font-weight="700" fill="#2D3A29" text-anchor="middle">ПЕРГА</text>
    <line x1="225" y1="283" x2="275" y2="283" stroke="#C28236" stroke-width="1"/>
    <text x="250" y="294" font-family="'JetBrains Mono', monospace" font-size="6" fill="#8C5513" text-anchor="middle">ТАЁЖНЫЙ СБОР</text>
    <text x="250" y="306" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="bold" fill="#2D3A29" text-anchor="middle">ЖИВЫЕ ТРАВЫ</text>
  </g>
</svg>